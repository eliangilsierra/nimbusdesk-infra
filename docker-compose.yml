version: "3.8"

# NimbusDesk v1 — docker-compose de desarrollo local.
# Requiere que cada repo nimbusdesk-* esté clonado como hermano de este
# (ej. D:\Git\nimbusdesk-infra, D:\Git\nimbusdesk-discovery-server, ...).
#
# Los servicios de aplicación empiezan comentados: se habilitan a medida que
# cada repo se va construyendo (ver ROADMAP.md, Fases 1 a 7).

networks:
  nimbusdesk-net:
    driver: bridge

volumes:
  mysql-data:
  mssql-data:

services:
  mysql:
    image: mysql:8.0
    container_name: nimbusdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nimbusdesk_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nimbusdesk}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - nimbusdesk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-nimbusdesk_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nimbusdesk-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-NimbusDesk_Dev1}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - nimbusdesk-net

